# Local services. V2 has a single container: the syllabus parser (V2-08 §2.9).
# celery_worker / celery_beat / redis were removed: V2 runs no Celery, and Upstash is REST-only
# (the TS modules fall back to the DB lease and an in-memory rate limit without it).
#
#   docker compose up --build parser    →  http://localhost:8000/healthz
#
# Secrets come only from services/parser/.env.local (copy services/parser/.env.example), so
# the container never sees the TS app's .env.local. PARSER_FAKE_LLM=1 there serves a canned
# extraction without calling Anthropic.
services:
  parser:
    build:
      context: ./services/parser
    ports:
      - "8000:8080"
    env_file:
      - path: ./services/parser/.env.local
        required: false
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 3
